<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <img src="/images/my_logo.png" alt="Chandan Nayak" class="login-logo__img" />
    </div>

    <h1 class="login-title">Welcome to My Portfolio</h1>
    <p class="login-subtitle">Please introduce yourself before exploring</p>

    <form class="login-form" (ngSubmit)="submit()" #f="ngForm">

      <div class="login-field">
        <label for="name">Full Name</label>
        <input id="name" type="text" [(ngModel)]="name" name="name"
          placeholder="Your name" autocomplete="name" />
      </div>

      <div class="login-field">
        <label for="email">Email Address</label>
        <input id="email" type="email" [(ngModel)]="email" name="email"
          placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="login-field">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" [(ngModel)]="phone" name="phone"
          placeholder="10-digit mobile number" autocomplete="tel"
          maxlength="10" pattern="[0-9]{10}"
          (keypress)="$event.charCode >= 48 && $event.charCode <= 57 || $event.preventDefault()" />
      </div>

      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }

      <button type="submit" class="login-btn" [disabled]="loading()">
        {{ loading() ? 'Entering...' : 'Enter Portfolio →' }}
      </button>

    </form>

    <p class="login-note">Your info is only stored locally and never shared.</p>
  </div>
</div>
