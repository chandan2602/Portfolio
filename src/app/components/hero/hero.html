<section class="hero" id="hero">
  <!-- Geometric motif background -->
  <svg class="geo-motif geo-motif--tl" width="400" height="400" viewBox="0 0 400 400" aria-hidden="true">
    <polygon points="200,10 390,390 10,390" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <polygon points="200,50 350,370 50,370" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <polygon points="200,90 310,350 90,350" fill="none" stroke="#ff6b35" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#3b82f6" stroke-width="0.8"/>
    <circle cx="200" cy="200" r="80" fill="none" stroke="#ff6b35" stroke-width="0.6"/>
  </svg>

  <div class="hero__layout container">
    <div class="hero__content">
      <p class="hero__greeting">Namaste, I'm</p>
      <h1 class="hero__name">{{ name() }}</h1>
      <p class="hero__headline">{{ headline() }}</p>
      <div class="hero__actions">
        <a href="#projects" class="btn btn--primary">View My Work</a>
        <a [href]="github()" target="_blank" rel="noopener" class="btn btn--outline">GitHub</a>
        <a [href]="linkedin()" target="_blank" rel="noopener" class="btn btn--ghost">LinkedIn</a>
      </div>
    </div>
    <div class="hero__photo-wrap">
      <div class="hero__photo-ring" aria-hidden="true"></div>
      <img [src]="photoUrl()" alt="Photo of Chandan Kumar Nayak" class="hero__photo" />
    </div>
  </div>

  <div class="hero__tags container" aria-label="Tech stack">
    @for (tag of tags; track tag) {
      <span class="hero__tag">{{ tag }}</span>
    }
  </div>

  <a href="#about" class="hero__scroll" aria-label="Scroll to About section">
    <span class="hero__scroll-dot"></span>
  </a>
</section>
