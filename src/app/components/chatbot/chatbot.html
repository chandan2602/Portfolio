<!-- Floating toggle button -->
<button
  class="cb-fab"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen()"
  aria-label="Toggle AI assistant"
  [class.cb-fab--open]="isOpen()"
>
  <span class="cb-fab__icon cb-fab__icon--chat" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="10" r="1" fill="currentColor"/>
      <circle cx="12" cy="10" r="1" fill="currentColor"/>
      <circle cx="15" cy="10" r="1" fill="currentColor"/>
    </svg>
  </span>
  <span class="cb-fab__icon cb-fab__icon--close" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </span>
  <span class="cb-fab__pulse"></span>
</button>

<!-- Chat window -->
@if (isOpen()) {
  <div class="cb-window" role="dialog" aria-label="AI Chat Assistant" aria-modal="true">

    <!-- Header -->
    <div class="cb-header">
      <div class="cb-header__avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="cb-header__info">
        <span class="cb-header__name">Chandan's AI Assistant</span>
        <span class="cb-header__status">
          <span class="cb-header__dot"></span> Online
        </span>
      </div>
      <div class="cb-header__actions">
        <a [href]="'tel:' + phone" class="cb-header__call" aria-label="Call Chandan" title="Call Chandan">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.02z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <button class="cb-header__close" (click)="toggle()" aria-label="Close chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="cb-messages" role="log" aria-live="polite">
      @for (msg of messages(); track $index) {
        <div class="cb-msg" [class.cb-msg--user]="msg.role === 'user'" [class.cb-msg--bot]="msg.role === 'bot'">
          @if (msg.role === 'bot') {
            <div class="cb-msg__avatar" aria-hidden="true">🤖</div>
          }
          <div class="cb-msg__bubble">
            <p class="cb-msg__text" [innerHTML]="msg.text | cbFormat"></p>
            <span class="cb-msg__time">{{ msg.time }}</span>
          </div>
        </div>
      }

      @if (isTyping()) {
        <div class="cb-msg cb-msg--bot">
          <div class="cb-msg__avatar" aria-hidden="true">🤖</div>
          <div class="cb-msg__bubble cb-msg__bubble--typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      }

      <div #messagesEnd></div>
    </div>

    <!-- Suggestions -->
    @if (messages().length <= 1) {
      <div class="cb-suggestions">
        @for (s of suggestions; track s) {
          <button class="cb-suggestion" (click)="setInput(s)">{{ s }}</button>
        }
      </div>
    }

    <!-- Input -->
    <div class="cb-input-row">
      <input
        class="cb-input"
        type="text"
        placeholder="Ask me anything..."
        [ngModel]="userInput()"
        (ngModelChange)="userInput.set($event)"
        (keydown)="onKeydown($event)"
        aria-label="Type your message"
        autocomplete="off"
      />
      <button class="cb-send" (click)="send()" [disabled]="!userInput().trim()" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>
}
