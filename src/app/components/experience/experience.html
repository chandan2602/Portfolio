<section class="section experience" id="experience">
  <div class="container">
    <h2 class="section__title">Work <span>Experience</span></h2>
    <p class="section__subtitle">My professional journey so far</p>

    <div class="experience__layout">
      <div class="timeline">
        @for (job of experience(); track job.role) {
          <div class="timeline__item">
            <div class="timeline__marker" aria-hidden="true">
              <div class="timeline__dot"></div>
            </div>
            <article class="timeline__card">
              <div class="timeline__header">
                <div>
                  <h3 class="timeline__role">{{ job.role }}</h3>
                  <span class="timeline__company">@ {{ job.company }}</span>
                </div>
                <span class="timeline__period">{{ job.period }}</span>
              </div>
              <ul class="timeline__bullets">
                @for (bullet of job.bullets; track bullet) {
                  <li>{{ bullet }}</li>
                }
              </ul>
            </article>
          </div>
        }
      </div>

      <div class="growth-img-wrap">
        <img src="images/growth.png" alt="My Growth" class="growth-img" />
      </div>
    </div>
  </div>
</section>
