<section class="section projects" id="projects">
  <div class="container">
    <h2 class="section__title">Featured <span>Projects</span></h2>
    <p class="section__subtitle">Real-world problems solved with AI and modern web tech</p>

    <div class="projects__grid">
      @for (p of projects(); track p.name; let i = $index) {
        <article class="project-card" [class.project-card--featured]="i === 0">
          <div class="project-card__top">
            <span class="project-card__emoji" aria-hidden="true">{{ p.emoji }}</span>
            <div class="project-card__links">
              <a [href]="p.github" target="_blank" rel="noopener" class="project-card__link" aria-label="GitHub repository for {{ p.name }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
              </a>
              <a [href]="p.demo" target="_blank" rel="noopener" class="project-card__link" aria-label="Live demo for {{ p.name }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            </div>
          </div>

          <h3 class="project-card__name">{{ p.name }}</h3>
          <p class="project-card__tech">{{ p.tech }}</p>

          <div class="project-card__body">
            <p class="project-card__row"><span class="project-card__label">Problem</span>{{ p.problem }}</p>
            <p class="project-card__row"><span class="project-card__label">Solution</span>{{ p.solution }}</p>
          </div>

          <div class="project-card__impact">
            <span class="project-card__impact-icon" aria-hidden="true">🎯</span>
            {{ p.impact }}
          </div>
        </article>
      }
    </div>
  </div>
</section>
